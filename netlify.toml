[build]
  command = "npm run build"
  publish = ".next"

  [build.environment]
    # Pin the Node major, and pin it in TWO places that agree.
    #
    # There was no pin at all, so a fresh Netlify site built on whatever its
    # default happened to be that week. Next 16 needs Node 20.9 or newer; the
    # default is currently 22 and this would have worked by luck. A build that
    # works by luck on the day you move accounts, hours before two students sit
    # a pilot, is not a build you want.
    #
    # `.nvmrc` says 22 as well. Netlify reads that file first and this second,
    # and they must not disagree.
    NODE_VERSION = "22"

    # Netlify's secret scanner fails the build when it finds an env var value
    # inside the build output. NEXT_PUBLIC_FIREBASE_API_KEY is *meant* to be in
    # the client bundle: a Firebase Web API key identifies the project, it does
    # not authorise anything, and Google documents it as public. Access is
    # controlled by Authorised Domains and security rules, not by hiding it.
    # The real secrets (OWNER_ACCESS_KEY, SUPER_ADMIN_PASSCODE, SESSION_SECRET)
    # are server-only and are deliberately NOT listed here, so the scanner keeps
    # protecting them.
    SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_SUPPORT_WHATSAPP"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify synchronous functions time out at 10s on the free tier.
# Every AI call in this app is deliberately scoped to a single answer so it
# stays well inside that budget. Do not add a whole-transcript evaluation call.
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(self)"
