<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - PreCAS Practice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Noto+Serif:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f8f9fc",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#9a7f61",
                        "surface-container-high": "#e7e8eb",
                        "tertiary-fixed": "#feddba",
                        "on-error-container": "#93000a",
                        "tertiary": "#000000",
                        "on-primary-container": "#778598",
                        "outline": "#74777d",
                        "inverse-on-surface": "#f0f1f4",
                        "on-surface-variant": "#44474c",
                        "surface-container-low": "#f2f3f6",
                        "on-primary-fixed-variant": "#3a4859",
                        "secondary-container": "#82fab7",
                        "inverse-primary": "#bac8dc",
                        "surface-variant": "#e1e2e5",
                        "secondary-fixed": "#82fab7",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#65dd9c",
                        "surface-dim": "#d9dadd",
                        "primary-fixed-dim": "#bac8dc",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",
                        "tertiary-container": "#281804",
                        "surface-bright": "#f8f9fc",
                        "tertiary-fixed-dim": "#e0c1a0",
                        "primary-fixed": "#d6e4f9",
                        "on-secondary-fixed-variant": "#005231",
                        "inverse-surface": "#2e3133",
                        "on-tertiary-fixed-variant": "#584329",
                        "primary-container": "#0f1c2c",
                        "secondary": "#006d42",
                        "on-primary-fixed": "#0f1c2c",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e1e2e5",
                        "surface": "#f8f9fc",
                        "on-secondary-fixed": "#002111",
                        "on-primary": "#ffffff",
                        "surface-container": "#edeef1",
                        "on-secondary-container": "#007347",
                        "outline-variant": "#c4c6cc",
                        "on-tertiary-fixed": "#281804",
                        "on-secondary": "#ffffff",
                        "primary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#525f71"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "40px",
                        "sm": "16px",
                        "base": "4px",
                        "md": "24px",
                        "xs": "8px",
                        "gutter": "20px",
                        "xl": "64px",
                        "container-max": "1120px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "display": ["Noto Serif"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg": ["Noto Serif"],
                        "headline-sm": ["Noto Serif"],
                        "label-sm": ["Hanken Grotesk"],
                        "display-mobile": ["Noto Serif"],
                        "headline-md": ["Noto Serif"],
                        "label-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

                        "display-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col md:flex-row">
<!-- Left Panel (Desktop only) -->
<div class="hidden md:flex md:w-1/2 bg-surface-container-low flex-col items-center justify-center p-xl relative overflow-hidden">
<div class="absolute inset-0 z-0">
<img alt="Student at a laptop" class="w-full h-full object-cover opacity-90 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida/AP1WRLuQCOcvnBRGiZwE9m87mWYb3v9O6ISlVvo4wTB4Dwbujk0j6otuZ_6OwOFgpxXd-sFCwFzsPJ0qlQT8oT4cFu1-LPdmDppFXWGiwhJBJ-a1Z19xZr9fuCGnj2JksrmhRQ_7j01zpWy6pLRlqEmAoJQy7vABUzbwRfpNBpD5H98pdsDgsDAlmjM9G-9GGso78ZThzSet9qhndDBEaJYyqVXfU62ePTmUcmAYhdC4sd0MKYOtlVRBdj1v_9g"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-low/20 to-surface-container-low/80"></div>
</div>
<div class="relative z-10 max-w-md text-center mt-auto pb-xl">
<p class="font-headline-sm text-headline-sm text-on-surface-variant font-medium">
                Ten real questions. No card. No account to fill in.
            </p>
</div>
</div>
<!-- Right Panel (Sign-in) -->
<div class="w-full md:w-1/2 flex flex-col items-center justify-center p-md bg-surface">
<div class="w-full max-w-[400px] flex flex-col items-center space-y-lg">
<!-- Brand / Logo area (optional, keeping it minimal as requested) -->
<div class="text-center w-full">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm">
                    Sign in to start
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    We use Google so you never have to make another password. We only ever see your name and email.
                </p>
</div>
<!-- Sign in Actions -->
<div class="w-full space-y-md">
<!-- Default State Button -->
<button class="w-full h-12 flex items-center justify-center bg-on-primary text-on-surface border border-outline-variant rounded-[12px] hover:bg-surface-container-low transition-colors duration-200 shadow-[0_1px_2px_rgba(13,27,42,0.04)]" onclick="document.getElementById('loading-state').classList.remove('hidden'); this.classList.add('hidden'); setTimeout(() =&gt; { document.getElementById('popup-blocked').classList.remove('hidden'); }, 1500);">
<svg class="w-5 h-5 mr-3" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md">Continue with Google</span>
</button>
<!-- Loading State Button (Initially Hidden) -->
<button class="hidden w-full h-12 flex items-center justify-center bg-on-primary text-on-surface border border-outline-variant rounded-[12px] shadow-[0_1px_2px_rgba(13,27,42,0.04)] cursor-default" id="loading-state">
<span class="material-symbols-outlined spinner mr-3 text-on-surface-variant" style="font-variation-settings: 'FILL' 0, 'wght' 400;">refresh</span>
<span class="font-label-md text-label-md text-on-surface-variant">Signing you in...</span>
</button>
<!-- Pop-up Blocked State (Initially Hidden) -->
<div class="hidden bg-surface-container-low border border-outline-variant rounded-[12px] p-sm flex items-start space-x-sm" id="popup-blocked">
<span class="material-symbols-outlined text-on-surface-variant shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 0, 'wght' 400;">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Your browser blocked the pop-up. We will open Google in this tab instead.
                    </p>
</div>
</div>
<!-- Footer -->
<div class="text-center mt-xl">
<p class="font-body-sm text-body-sm text-on-surface-variant/70">
                    By continuing you agree to our Terms and Privacy.
                </p>
</div>
</div>
</div>
</body></html>
