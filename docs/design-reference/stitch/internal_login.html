<body class="bg-background min-h-screen flex items-center justify-center p-md">
<main class="w-full max-w-[400px]">
<div class="bg-surface rounded-xl shadow-[0_8px_24px_rgba(13,27,42,.06)] border border-outline-variant p-lg flex flex-col gap-md">
<div class="text-center flex flex-col gap-xs">
<span class="material-symbols-outlined text-primary text-4xl mb-xs" style="font-variation-settings: 'FILL' 0;">admin_panel_settings</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Internal Access</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your passcode to manage the platform.</p>
</div>
<form class="flex flex-col gap-md mt-sm">
<div class="flex flex-col gap-base relative">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="passcode">Passcode</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded-lg px-sm py-xs font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow pr-10" id="passcode" name="passcode" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 px-sm flex items-center text-on-surface-variant hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-lg py-xs px-sm font-label-md text-label-md hover:bg-inverse-surface transition-colors mt-xs flex items-center justify-center gap-base" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="mt-sm text-center">
<a class="font-label-sm text-label-sm text-outline hover:text-on-surface transition-colors" href="#">Need help? Contact IT Support</a>
</div>
</div>
</main>
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#passcode');
        const toggleIcon = document.querySelector('#toggleIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });
    </script>
