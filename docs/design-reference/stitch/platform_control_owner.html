<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Owner Stark Page - Sikshya</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Noto+Serif:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#584329",
                        "on-background": "#191c1e",
                        "surface-bright": "#f8f9fc",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#bac8dc",
                        "error": "#ba1a1a",
                        "surface-variant": "#e1e2e5",
                        "tertiary-fixed": "#feddba",
                        "primary-container": "#0f1c2c",
                        "on-tertiary-fixed": "#281804",
                        "tertiary": "#000000",
                        "surface": "#f8f9fc",
                        "on-secondary-fixed-variant": "#005231",
                        "on-secondary-container": "#007347",
                        "surface-tint": "#525f71",
                        "primary": "#000000",
                        "on-tertiary-container": "#9a7f61",
                        "surface-dim": "#d9dadd",
                        "background": "#f8f9fc",
                        "tertiary-fixed-dim": "#e0c1a0",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#d6e4f9",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c4c6cc",
                        "secondary-fixed-dim": "#65dd9c",
                        "on-primary": "#ffffff",
                        "secondary": "#006d42",
                        "tertiary-container": "#281804",
                        "outline": "#74777d",
                        "on-primary-fixed-variant": "#3a4859",
                        "inverse-surface": "#2e3133",
                        "on-primary-container": "#778598",
                        "surface-container-high": "#e7e8eb",
                        "on-error": "#ffffff",
                        "secondary-container": "#82fab7",
                        "secondary-fixed": "#82fab7",
                        "surface-container-highest": "#e1e2e5",
                        "on-secondary-fixed": "#002111",
                        "inverse-primary": "#bac8dc",
                        "surface-container": "#edeef1",
                        "on-surface-variant": "#44474c",
                        "on-surface": "#191c1e",
                        "inverse-on-surface": "#f0f1f4",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#0f1c2c",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f3f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "64px",
                        "container-max": "1120px",
                        "sm": "16px",
                        "base": "4px",
                        "md": "24px",
                        "gutter": "20px",
                        "xs": "8px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"],
                        "display-mobile": ["Noto Serif"],
                        "label-sm": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "display": ["Noto Serif"],
                        "headline-sm": ["Noto Serif"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Noto Serif"],
                        "headline-lg": ["Noto Serif"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "display-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-sm md:p-lg antialiased">
<!-- Suppressed TopAppBar and SideNav/BottomNav because this is a highly focused, linear transactional page (system override/pause). Canvas prioritization. -->
<main class="w-full max-w-[600px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg flex flex-col gap-xl">
<header class="flex flex-col gap-xs text-center border-b border-outline-variant pb-md">
<h1 class="font-display-mobile md:font-display text-display-mobile md:text-display text-on-surface tracking-tight">System Override</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Global platform administration.</p>
</header>
<form aria-label="System Pause Form" class="flex flex-col gap-lg">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="override_passcode">Authorization Passcode</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant select-none" data-icon="lock" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-xl pr-sm py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:bg-surface-sunk focus:border-outline focus:ring-1 focus:ring-outline transition-all" id="override_passcode" name="override_passcode" placeholder="Enter secure passcode" required="" type="password"/>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="pause_message">Message students see while paused</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:bg-surface-sunk focus:border-outline focus:ring-1 focus:ring-outline transition-all resize-y" id="pause_message" name="pause_message" placeholder="E.g., The platform is currently paused for emergency maintenance. We will resume shortly." required="" rows="4"></textarea>
</div>
<div class="flex flex-col gap-sm border-t border-error-container pt-lg mt-md">
<button class="w-full bg-surface-container-lowest border-2 border-error text-error font-label-md text-label-md py-md rounded-lg hover:bg-error-container hover:text-on-error-container transition-colors flex items-center justify-center gap-xs" type="submit">
<span class="material-symbols-outlined" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
                    Pause the whole platform
                </button>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-sm">
                    This closes every page and every action for everyone, including admins. Nothing is deleted.
                </p>
</div>
</form>
</main>
</body></html>
